[package]
name = "keystone-jwt-verify"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
description = "External JWT signature verification via OIDC discovery and JWKS (EC528 Keystone-NG, issue #6)"

[dependencies]
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
jsonwebtoken = { version = "11.1", features = ["rust_crypto"] }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
httpmock = { version = "0.8", features = ["http2"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
expect_used = "deny"
unwrap_used = "deny"
print_stdout = "deny"
